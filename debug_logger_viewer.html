<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Logger Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
        }

        h1 { margin-bottom: 20px; }
        h2 { margin-bottom: 15px; }

        .section {
            display: none;
            margin-bottom: 20px;
            padding: 15px;
        }

        .section.active { display: block; }

        .box {
            margin-bottom: 15px;
        }

        input[type="file"] { margin-bottom: 10px; }
        button { padding: 10px 20px; margin: 5px 0; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        tr.clickable { cursor: pointer; }
        tr.clickable:hover { background: #f5f5f5; }

        .info-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .info-box {
            padding: 15px;
            border: 1px solid #ccc;
            min-width: 150px;
        }

        .info-box .label { margin-bottom: 5px; font-size: 0.9em; }
        .info-box .value { font-size: 1.2em; font-weight: bold; }

        .log-container { max-height: 400px; overflow: auto; margin-top: 15px; }
        .log-table { font-size: 0.85em; }

        .copy-section { margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
        .empty-state { padding: 40px; text-align: center; }
    </style>
</head>
<body>
    <h1>DEBUG LOGGER VIEWER</h1>

    <!-- Auth Section -->
    <div id="auth-section" class="section active">
        <div class="box">
            <label style="margin-bottom: 5px; display: block;">Service Account JSON:</label>
            <input type="file" id="json-file" accept=".json">
            <button onclick="connect()" style="margin-top: 10px;">Connect</button>
        </div>
        <div id="status" style="margin-top: 10px;"></div>
    </div>

    <!-- Search Section -->
    <div id="search-section" class="section">
        <div class="box">
            <label style="margin-bottom: 5px; display: block;">Enter Session ID:</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="session-id-input" placeholder="e.g., abc123-def456..." style="flex: 1; padding: 10px; font-size: 1em;">
                <button onclick="searchSession()" style="padding: 10px 20px;">Search</button>
            </div>
        </div>
        <div id="search-status" style="margin-top: 10px;"></div>
    </div>

    <!-- Session Data Section -->
    <div id="session-section" class="section">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button onclick="goBackToSearch()">← New Search</button>
            <button onclick="clearCache()" style="background: #f0f0f0;">Clear Cache</button>
        </div>
        <div id="session-header"></div>
        <h2>Devices</h2>
        <div id="devices-table-container"></div>
    </div>

    <!-- Logs Section -->
    <div id="logs-section" class="section">
        <button onclick="showSection('session')" style="margin-bottom: 15px;">← Back to Devices</button>
        <div class="info-grid" id="log-info"></div>
        <div class="copy-section">
            <button onclick="copyLogsPosition()">Copy Position</button>
            <button onclick="copyLogsSequence()">Copy Sequence Index</button>
        </div>
        <div id="logs-table-container"></div>
    </div>

    <script>
        let projectId = 'jam-sync-db';
        let accessToken = '';
        let currentSession = null;
        let selectedDevice = null;
        let allLogs = [];
        let devicesMap = {};

        // Cache for session data and logs
        const cache = {
            sessionData: {},
            logsData: {}
        };

        const jsonFileInput = document.getElementById('json-file');
        const statusDiv = document.getElementById('status');
        const searchStatusDiv = document.getElementById('search-status');

        async function connect() {
            const file = jsonFileInput.files[0];
            if (!file) {
                statusDiv.textContent = 'Please select a JSON file';
                return;
            }

            try {
                statusDiv.textContent = 'Connecting...';
                const text = await file.text();
                const serviceAccount = JSON.parse(text);

                if (!serviceAccount.client_email || !serviceAccount.private_key) {
                    throw new Error('Invalid service account');
                }

                accessToken = await getAccessToken(serviceAccount);
                statusDiv.textContent = 'Connected!';
                showSection('search');
            } catch (error) {
                statusDiv.textContent = 'Error: ' + error.message;
            }
        }

        async function searchSession() {
            const sessionIdInput = document.getElementById('session-id-input');
            const sessionId = sessionIdInput.value.trim();

            if (!sessionId) {
                searchStatusDiv.textContent = 'Please enter a session ID';
                return;
            }

            if (!accessToken) {
                searchStatusDiv.textContent = 'Please connect with service account JSON first';
                return;
            }

            searchStatusDiv.textContent = 'Searching...';

            try {
                // Check cache first
                if (cache.sessionData[sessionId] && cache.logsData[sessionId]) {
                    currentSession = sessionId;
                    renderFromCache(sessionId);
                    return;
                }

                // Fetch session data directly by ID
                const sessionData = await firestoreRequest(`/main_sessions/${sessionId}`);

                if (!sessionData.fields) {
                    searchStatusDiv.textContent = 'Session not found';
                    return;
                }

                currentSession = sessionId;
                await loadSessionData(sessionData, sessionId);
            } catch (error) {
                searchStatusDiv.textContent = 'Error: ' + error.message;
            }
        }

        async function loadSessionData(sessionData, sessionId) {
            // Check cache first
            if (cache.sessionData[sessionId] && cache.logsData[sessionId]) {
                renderFromCache(sessionId);
                return;
            }

            const fields = sessionData.fields || {};
            const startedAt = parseTimestamp(fields, 'startedAt');

            // Fetch logs subcollection
            const logsData = await firestoreRequest(`/main_sessions/${currentSession}/logs?pageSize=1000`);

            // Store in cache
            cache.sessionData[currentSession] = sessionData;
            cache.logsData[currentSession] = logsData;

            processAndRenderLogs(logsData, fields, startedAt);
        }

        function processAndRenderLogs(logsData, fields, startedAt) {
            allLogs = [];
            devicesMap = {};

            if (logsData.documents) {
                logsData.documents.forEach(doc => {
                    const logData = {};
                    Object.keys(doc.fields || {}).forEach(key => {
                        const f = doc.fields[key];
                        logData[key] = f.stringValue ?? f.integerValue ?? f.doubleValue ?? null;
                    });
                    allLogs.push(logData);
                    if (!devicesMap[logData.client]) devicesMap[logData.client] = [];
                    devicesMap[logData.client].push(logData);
                });
            }

            document.getElementById('session-header').innerHTML = `
                <div class="info-grid" style="margin-bottom: 20px;">
                    <div class="info-box"><div class="label">Session ID</div><div class="value">${currentSession}</div></div>
                    <div class="info-box"><div class="label">Room ID</div><div class="value">${fields.roomID?.stringValue || '-'}</div></div>
                    <div class="info-box"><div class="label">Started</div><div class="value">${startedAt.toLocaleString()}</div></div>
                    <div class="info-box"><div class="label">Total Logs</div><div class="value">${allLogs.length}</div></div>
                    <div class="info-box"><div class="label">Devices</div><div class="value">${Object.keys(devicesMap).length}</div></div>
                </div>`;

            renderDevices();
            showSection('session');
            searchStatusDiv.textContent = '';
        }

        function renderFromCache(sessionId) {
            const sessionData = cache.sessionData[sessionId];
            const logsData = cache.logsData[sessionId];
            const fields = sessionData.fields || {};
            const startedAt = parseTimestamp(fields, 'startedAt');

            // Process logs data
            allLogs = [];
            devicesMap = {};

            if (logsData.documents) {
                logsData.documents.forEach(doc => {
                    const logData = {};
                    Object.keys(doc.fields || {}).forEach(key => {
                        const f = doc.fields[key];
                        logData[key] = f.stringValue ?? f.integerValue ?? f.doubleValue ?? null;
                    });
                    allLogs.push(logData);
                    if (!devicesMap[logData.client]) devicesMap[logData.client] = [];
                    devicesMap[logData.client].push(logData);
                });
            }

            document.getElementById('session-header').innerHTML = `
                <div class="info-grid" style="margin-bottom: 20px;">
                    <div class="info-box"><div class="label">Session ID</div><div class="value">${sessionId}</div></div>
                    <div class="info-box"><div class="label">Room ID</div><div class="value">${fields.roomID?.stringValue || '-'}</div></div>
                    <div class="info-box"><div class="label">Started</div><div class="value">${startedAt.toLocaleString()}</div></div>
                    <div class="info-box"><div class="label">Total Logs</div><div class="value">${allLogs.length}</div></div>
                    <div class="info-box"><div class="label">Devices</div><div class="value">${Object.keys(devicesMap).length}</div></div>
                    <div class="info-box"><div class="label">(cached)</div><div class="value" style="color: green;">✓</div></div>
                </div>`;

            renderDevices();
            showSection('session');
            searchStatusDiv.textContent = '';
        }

        function renderDevices() {
            const container = document.getElementById('devices-table-container');
            const deviceEntries = Object.entries(devicesMap);

            if (deviceEntries.length === 0) {
                container.textContent = 'No devices found';
                return;
            }

            let html = '<table><thead><tr><th>#</th><th>Device ID</th><th>Entries</th></tr></thead><tbody>';
            deviceEntries.forEach(([clientId, logs], i) => {
                const shortId = clientId.length > 8 ? clientId.slice(0, 8) + '...' : clientId;
                html += `<tr class="clickable" onclick="loadLogs('${clientId.replace(/'/g, "\\'")}')">
                    <td>${i+1}</td><td title="${clientId}">${shortId}</td><td>${logs.length}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function goBackToSearch() {
            selectedDevice = null;
            allLogs = [];
            devicesMap = {};
            // Keep cache intact for back navigation
            document.getElementById('session-id-input').value = '';
            showSection('search');
        }

        function clearCache() {
            cache.sessionData = {};
            cache.logsData = {};
            alert('Cache cleared!');
        }

        async function getAccessToken(serviceAccount) {
            const now = Math.floor(Date.now() / 1000);

            const header = { alg: 'RS256', typ: 'JWT' };
            const headerEncoded = btoa(JSON.stringify(header)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

            const payload = {
                iss: serviceAccount.client_email,
                sub: serviceAccount.client_email,
                aud: 'https://oauth2.googleapis.com/token',
                iat: now,
                exp: now + 3600,
                scope: 'https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/datastore'
            };
            const payloadEncoded = btoa(JSON.stringify(payload)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

            const signatureInput = `${headerEncoded}.${payloadEncoded}`;
            const signature = await signRS256(signatureInput, serviceAccount.private_key);
            const jwt = `${signatureInput}.${signature}`;

            const response = await fetch('https://oauth2.googleapis.com/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error_description || data.error);
            return data.access_token;
        }

        async function signRS256(data, privateKeyPem) {
            const pemContents = privateKeyPem.replace('-----BEGIN PRIVATE KEY-----', '').replace('-----END PRIVATE KEY-----', '').replace(/\s/g, '');
            const bytes = new Uint8Array(atob(pemContents).split('').map(c => c.charCodeAt(0)));

            const key = await crypto.subtle.importKey('pkcs8', bytes, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
            const signature = await crypto.subtle.sign({ name: 'RSASSA-PKCS1-v1_5' }, key, new TextEncoder().encode(data));
            return btoa(String.fromCharCode(...new Uint8Array(signature))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function firestoreRequest(path, method = 'GET', body = null) {
            const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents${path}`;
            const options = {
                method,
                headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' }
            };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || `HTTP ${response.status}`);
            return data;
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(`${sectionId}-section`).classList.add('active');
        }

        function parseTimestamp(fields, fieldName) {
            const field = fields[fieldName];
            if (!field) return new Date(0);
            if (field.timestampValue) return new Date(field.timestampValue);
            if (field.mapValue?.fields?.seconds?.integerValue) {
                return new Date(parseInt(field.mapValue.fields.seconds.integerValue) * 1000);
            }
            return new Date();
        }

        function loadLogs(clientId) {
            selectedDevice = clientId;
            const deviceLogs = allLogs.filter(l => l.client === clientId).sort((a, b) => (a.logSequence || 0) - (b.logSequence || 0));

            document.getElementById('log-info').innerHTML = `
                <div class="info-box"><div class="label">Device ID</div><div class="value">${clientId}</div></div>
                <div class="info-box"><div class="label">Total Entries</div><div class="value">${deviceLogs.length}</div></div>`;

            const container = document.getElementById('logs-table-container');
            if (!deviceLogs.length) { container.textContent = 'No logs'; return; }

            let html = '<div class="log-container"><table class="log-table"><thead><tr><th>Index</th><th>localTime</th><th>positionMs</th><th>sequence</th><th>offset</th></tr></thead><tbody>';
            deviceLogs.forEach(log => {
                html += `<tr><td>${log.currentIndex ?? '-'}</td><td>${log.localTime ?? '-'}</td><td>${log.currentPosition ?? '-'}</td><td>${log.logSequence ?? '-'}</td><td>${log.serverTimeOffset ?? '-'}</td></tr>`;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
            showSection('logs');
        }

        function copyLogsPosition() {
            if (!selectedDevice) {
                alert('Please select a device first');
                return;
            }
            const deviceLogs = allLogs
                .filter(l => l.client === selectedDevice)
                .sort((a, b) => (a.logSequence || 0) - (b.logSequence || 0));
            let csv = '';
            deviceLogs.forEach(log => {
                csv += (log.currentPosition ?? '') + '\n';
            });
            navigator.clipboard.writeText(csv).then(() => alert('Copied ' + deviceLogs.length + ' entries!')).catch(() => alert('Failed to copy'));
        }

        function copyLogsSequence() {
            if (!selectedDevice) {
                alert('Please select a device first');
                return;
            }
            const deviceLogs = allLogs
                .filter(l => l.client === selectedDevice)
                .sort((a, b) => (a.logSequence || 0) - (b.logSequence || 0));
            let csv = '';
            deviceLogs.forEach(log => {
                csv += (log.logSequence ?? '') + '\n';
            });
            navigator.clipboard.writeText(csv).then(() => alert('Copied ' + deviceLogs.length + ' entries!')).catch(() => alert('Failed to copy'));
        }
    </script>
</body>
</html>
